name: push_bonds_daily

env:
  PYTHON_VERSION: "3.11" # Python 3.8 已在 Ubuntu 26.04 runner 上不可用
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
on:
  workflow_dispatch:  # 手动触发
  schedule:
    # 每天北京时间 06:00 自动触发（对应 UTC 22:00）
    - cron: '0 22 * * *'
    # 每天北京时间 09:30 自动触发（对应 UTC 01:30）
    - cron: '30 1 * * *'

jobs:
  daily-push:
    runs-on: ubuntu-latest
    env:
      SERVERCHAN_API_KEY: ${{ secrets.SERVERCHAN_API_KEY }}

    permissions:
      issues: write
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: pip install requests

      - name: PUSH BONDS DAILY
        run: python bonds.py
