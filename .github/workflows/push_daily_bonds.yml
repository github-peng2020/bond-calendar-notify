name: push_bonds_daily

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  workflow_dispatch:  # 手动触发
  schedule:
    # 每天北京时间 06:00 自动触发（对应 UTC 22:00）
    - cron: '0 22 * * *'
    # 每天北京时间 09:30 自动触发（对应 UTC 01:30）
    - cron: '30 1 * * *'

jobs:
  daily-push:
    runs-on: ubuntu-latest
    env:
      SERVERCHAN_API_KEY: ${{ secrets.SERVERCHAN_API_KEY }}

    permissions:
      issues: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 直接使用 runner 预装的 Python，避免 setup-python 下载指定版本失败
      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: python -m pip install --quiet requests

      - name: PUSH BONDS DAILY
        run: python bonds.py
